# BoT-SORT tuned for broadcast football (moving camera, brief misses).
# Match by motion and overlap. Appearance ReID from the detector features
# swapped same-kit players across the pitch, so it stays off.

tracker_type: botsort
track_high_thresh: 0.2
track_low_thresh: 0.05
new_track_thresh: 0.35
track_buffer: 90
match_thresh: 0.7
fuse_score: True

gmc_method: sparseOptFlow

proximity_thresh: 0.5
appearance_thresh: 0.8
with_reid: False
model: auto
